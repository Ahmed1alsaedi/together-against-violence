<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاً ضد العنف ضد المرأة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{--bg:#fff4ea;--card:#fff;--ink:#3a2314;--mut:#7a5a44;--pri:#c2500a;--on:#fff;--ok:#1f8a5b;--okbg:#dff3e8;--no:#b3261e;--nobg:#fbe3df;--line:#f3d9c3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241609;--card:#33200f;--ink:#fff1e6;--mut:#d9b99f;--pri:#ff9a4d;--on:#241609;--ok:#5fd29b;--okbg:#17382a;--no:#ff8d7f;--nobg:#401f1b;--line:#573a22}}
:root[data-theme="dark"]{--bg:#241609;--card:#33200f;--ink:#fff1e6;--mut:#d9b99f;--pri:#ff9a4d;--on:#241609;--ok:#5fd29b;--okbg:#17382a;--no:#ff8d7f;--nobg:#401f1b;--line:#573a22}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:calc(16px*var(--fs,1))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;font-size:1.375rem;line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none}
#app{max-width:900px;margin:0 auto;padding:24px 20px 40px}
h1{font-size:2.1rem;margin:8px 0 6px;color:var(--pri)}
p.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:18px 20px;min-height:64px;text-align:center}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.menu .grid button{padding:26px 20px;font-size:1.25rem;font-weight:700;border-color:var(--pri)}
.menu small{display:block;font-weight:400;color:var(--mut);font-size:.8rem;margin-top:4px}
.prim{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:28px;margin-bottom:18px}
.q{font-size:1.5rem;font-weight:700;min-height:110px;display:flex;align-items:center;color:var(--ink);margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;color:var(--mut)}
.bar button{min-height:48px;padding:8px 18px;font-size:.9rem}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>button{flex:1;min-width:min(100%,200px)}
.good{background:var(--okbg);border-color:var(--ok)}.bad{background:var(--nobg);border-color:var(--no)}
.fb{border-radius:18px;padding:18px 22px;margin:14px 0;border:2px solid}
.fb b{display:block;font-size:1.15rem;margin-bottom:4px}
.opts{display:grid;gap:12px}.opts button{text-align:right}
.score{font-size:3rem;color:var(--pri);font-weight:800;text-align:center}
.rk{text-align:center;font-size:1.5rem;font-weight:800;margin:0 0 6px}
.num{font-size:2.6rem;font-weight:800;color:var(--pri);direction:ltr;display:inline-block}
.progress{text-align:center;color:var(--mut);font-size:1rem;margin:8px 0 5px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pri)}
.menu-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.menu-actions button{min-height:48px;padding:8px 15px;font-size:1rem}
.support-cta{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:800}
.contacts{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.contacts li{border-top:1px solid var(--line);padding:14px 0 0}
.contacts p{margin:4px 0 0;color:var(--mut);font-size:1rem}
.call{display:inline-flex;align-items:center;min-height:48px;gap:8px;color:var(--pri);font-weight:800}
.win{display:flex;gap:12px;align-items:center;justify-content:center;border:2px solid var(--pri);border-radius:18px;padding:14px 16px;margin:0 0 16px;background:var(--card);text-align:right}
.win strong,.win small{display:block}
.win strong{font-size:1.35rem;color:var(--pri)}
.win small{font-size:.95rem;color:var(--mut)}
.win-icon{font-size:2rem;line-height:1}
.victory-ticket{position:relative;max-width:560px;margin:0 auto 18px;border:2px dashed var(--pri);border-radius:26px;background:var(--card);padding:30px clamp(25px,7vw,48px);text-align:center}
.victory-ticket::before,.victory-ticket::after{content:"";position:absolute;top:50%;width:19px;height:36px;background:var(--bg);transform:translateY(-50%)}
.victory-ticket::before{left:-3px;border-radius:0 24px 24px 0}
.victory-ticket::after{right:-3px;border-radius:24px 0 0 24px}
.victory-trophy{display:grid;place-items:center;width:80px;height:80px;margin:0 auto 12px;border-radius:50%;background:var(--bg);font-size:2.7rem;line-height:1}
.victory-ticket h1{font-size:clamp(2rem,8vw,3rem);margin:0}
.victory-ticket p{margin:0}
.victory-ticket .victory-feedback{margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line);color:var(--mut);font-size:1rem}
.victory-actions{max-width:560px;margin:0 auto}
.result-note{text-align:center;color:var(--mut);font-size:1rem;margin:0 0 18px}
.support-info{color:var(--pri);display:inline-flex;align-items:center;min-height:44px;font-size:1rem;font-weight:700}
.home-featured{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin-bottom:16px}
.feature-button{display:flex;align-items:center;gap:12px;text-align:start;min-height:76px;padding:14px 16px}
.feature-button strong{display:block;font-size:1.22rem;line-height:1.3}
.feature-button.prim small{color:inherit}
.feature-icon{display:grid;place-items:center;flex:none;width:2.55rem;height:2.55rem;background:var(--bg);border-radius:12px;font-size:1.2rem}
.social-feature{border-color:var(--pri)}
.social-feature strong{color:var(--pri)}
.social-nav{justify-content:flex-end}
.social-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:12px;margin-bottom:16px}
.social-step{padding:16px;border:2px solid var(--line);border-radius:17px;background:var(--card)}
.social-step h2,.social-example h2{margin:0 0 7px;color:var(--pri);font-size:1.13rem}
.social-step p,.social-example p{margin:0;font-size:1rem}
.social-example{padding:16px 18px}
.social-example blockquote{margin:10px 0 14px;padding-inline-start:12px;border-inline-start:3px solid var(--pri);font-size:1.04rem}
.social-example-steps{margin:0;padding-inline-start:24px;font-size:1rem}
.social-example-steps li+li{margin-top:10px}
.social-example-steps li::marker,.social-example-steps strong{color:var(--pri);font-weight:800}
.social-example-steps strong{display:block}
.social-support{min-height:48px;padding:8px 15px;font-size:1rem}
.share-card{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px 22px;margin-top:22px;
  padding:16px 18px;border:2px solid var(--line);border-radius:20px;background:var(--card)}
.share-card img{display:block;width:clamp(120px,26vw,144px);height:auto;flex:none}
.share-copy{flex:1 1 155px}
.share-copy h2{margin:0 0 3px;color:var(--ink);font-size:1.23rem}
.share-copy p{margin:0;color:var(--mut);font-size:1rem}
.share-copy a{display:inline-flex;align-items:center;min-height:44px;color:var(--pri);font-size:.92rem;font-weight:700}
.question-kind{margin:0 0 6px;font-size:.95rem;color:var(--pri);font-weight:800}
.spot-shell{max-width:680px;margin-inline:auto}
.spot-shell .card{padding:clamp(15px,4vw,24px)}
.spot-score{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);
  margin:0 0 12px;padding-bottom:8px;color:var(--mut);font-size:.95rem}
.spot-score strong{color:var(--pri);font-variant-numeric:tabular-nums}
.spot-prompt{font-size:clamp(1.2rem,4vw,1.55rem);margin:0 0 12px}
.spot-sentence{font-size:1.16rem;line-height:2.1;overflow-wrap:anywhere}
.spot-phrase{display:inline-block;max-width:100%;min-height:44px;padding:.29em .33em;border:1px solid transparent;
  border-bottom-width:2px;border-radius:9px;color:var(--ink);font:inherit;line-height:1.45;vertical-align:baseline;text-align:start}
button.spot-phrase{background:var(--bg);border-color:var(--line);border-bottom-color:var(--pri)}
button.spot-phrase:hover{border-color:var(--pri)}
.spot-right{background:var(--okbg);border-bottom-color:var(--ok)}
.spot-missed{background:var(--nobg);box-shadow:inset 0 -2px var(--no)}
.spot-feedback{border-top:1px solid var(--line);padding-top:12px;margin-top:14px;font-size:1rem}
.spot-category{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;
  color:var(--ink);background:var(--bg);font-weight:800;font-size:.9rem}
.spot-reason{display:block;margin-top:5px}
.spot-next{width:100%;min-height:48px;padding:8px 10px;font-size:1rem}
.spot-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.victory-ticket .spot-sentence{margin-top:12px;font-size:1rem}
.learn-list{display:grid;gap:10px;margin:0 0 18px}
.learn-card{border:2px solid var(--line);border-radius:17px;background:var(--card)}
.learn-card[open]{border-color:var(--pri)}
.learn-card summary{cursor:pointer;padding:13px 16px;font-weight:800;font-size:1.12rem}
.learn-card summary::marker{color:var(--pri)}
.learn-card summary:focus-visible,.learn-sources summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.learn-detail{padding:0 17px 14px;font-size:1rem}
.learn-detail p{margin:0}
.learn-detail p+p{margin-top:8px}
.learn-detail strong,.learn-sources a{color:var(--pri)}
.learn-sources{font-size:.95rem;margin:12px 0}
.learn-sources summary{cursor:pointer;width:fit-content;color:var(--mut)}
.review h2{margin:0 0 12px;font-size:1.35rem}
.review ol{margin:0;padding-inline-start:24px}
.review-item{padding:12px 2px;border-top:1px solid var(--line)}
.review-item h3{margin:0 0 6px;font-size:1.1rem}
.review-item p{margin:4px 0 0;font-size:1rem}
.download-status:empty{display:none}
.tip{border-right:6px solid var(--pri);background:var(--card);border-radius:14px;padding:14px 18px;margin:0 0 20px;font-size:1rem}
.tip b{color:var(--pri)}
.logo{max-height:80px;max-width:60%;display:block;margin:0 0 8px}
.cnt{text-align:center;color:var(--mut);font-size:.9rem;margin-top:20px}
.pc{background:var(--pri);color:var(--on);border-radius:26px;padding:40px 28px;text-align:center;margin-bottom:18px}
.pb{font-size:1.1rem;font-weight:700;opacity:.9}
.pm{font-size:2rem;font-weight:800;margin:24px 0 12px;line-height:1.5}
.pn{font-size:1.2rem}
input{font:inherit;width:100%;margin-top:14px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
ul.l{margin:8px 0 0;padding:0 22px;font-size:1rem}
.nt{margin-top:8px;font-size:.95rem;font-weight:700}
.pc.s1{background:var(--card);color:var(--pri);border:4px solid var(--pri)}
.pc.s2{background:#3a2314;color:#ffd9b8}
.pt{font-size:1.1rem;opacity:.95;margin:0 0 18px}.pk{font-size:.8rem;opacity:.8;margin-top:18px}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.cf span{position:absolute;top:-40px;font-size:1.6rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.cf .balloon{top:auto;bottom:-175px;width:clamp(30px,6vw,62px);aspect-ratio:4/5;border-radius:50%;
background:radial-gradient(circle at 30% 26%,#ffffffc2,transparent 34%),var(--balloon);animation:rise ease-out forwards}
.balloon::before{content:"";position:absolute;top:96%;left:calc(50% - 4px);border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--balloon)}
.balloon::after{content:"";position:absolute;top:calc(96% + 7px);left:50%;width:8px;height:39px;border-inline-start:1px solid var(--mut);border-radius:50%}
@keyframes rise{0%{transform:translateY(0) rotate(-12deg)}45%{transform:translate(22px,-60vh) rotate(14deg)}100%{transform:translate(-12px,-135vh) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
@keyframes pop{from{transform:scale(.96);opacity:.5}}.fb{animation:pop .25s}
@media (prefers-reduced-motion:reduce){.fb{animation:none}}
</style>
</head>

function pick(a){return a[Math.floor(Math.random()*a.length)]}

function celebrate(withBalloons){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var layer=document.createElement("div");
  layer.className="cf";
  layer.setAttribute("aria-hidden","true");
  var colors=["#ed7139","#e85086","#557ccd","#e8a827","#259e79"];
  for(var i=0;i<(withBalloons?30:18);i++){
    var piece=document.createElement("span");
    piece.style.left=(4+Math.random()*88)+"%";
    piece.style.animationDuration=(2.2+Math.random()*1.6)+"s";
    piece.style.animationDelay=(Math.random()*.85)+"s";
    if(withBalloons&&i<12){
      piece.className="balloon";
      piece.style.setProperty("--balloon",colors[i%colors.length]);
    }else{
      piece.textContent=pick(["🧡","✨","🎉","✦"]);
    }
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(function(){layer.remove()},4800);
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var questionHistory=new Map();
function questionKey(item){return typeof item==="string"?item:item.q||item[0]}
function deal(game,bank,count){
  var key="awareness-question-history-v1:"+game;
  var history=questionHistory.get(key);
  try{
    var saved=JSON.parse(window.localStorage.getItem(key));
    if(saved&&Array.isArray(saved.seen)&&Array.isArray(saved.last))history=saved;
  }catch(error){ /* The rotation still works within this tab. */ }
  var seen=new Set(history?history.seen:[]);
  var last=new Set(history?history.last:[]);
  var shuffled=shuffle(bank);
  var ordered=shuffled.filter(function(item){return !last.has(questionKey(item))})
    .concat(shuffled.filter(function(item){return last.has(questionKey(item))}));
  var current=ordered.filter(function(item){return !seen.has(questionKey(item))}).slice(0,count);
  current.forEach(function(item){seen.add(questionKey(item))});
  if(current.length<count){
    var selected=new Set(current.map(questionKey));
    // Finish the old bank first, then start a new pass with different questions.
    var next=ordered.filter(function(item){return !selected.has(questionKey(item))}).slice(0,count-current.length);
    seen=new Set(next.map(questionKey));
    current=current.concat(next);
  }
  history={seen:Array.from(seen),last:current.map(questionKey)};
  questionHistory.set(key,history);
  try{window.localStorage.setItem(key,JSON.stringify(history))}catch(error){ /* Keep the in-memory rotation. */ }
  return current;
}

function spotSentence(question,chosen){
  var phrases=question.o.map(function(option,index){
    if(!chosen)return '<button class="spot-phrase" id="spot-option-'+index+'">'+option[0]+'</button>';
    if(option[1]){
      return '<mark class="spot-phrase spot-right"><span class="spot-sr">العبارة الصحيحة: </span>'+option[0]+'</mark>';
    }
    if(option===chosen){
      return '<mark class="spot-phrase spot-missed"><span class="spot-sr">اختيارك: </span>'+option[0]+'</mark>';
    }
    return '<span class="spot-phrase">'+option[0]+'</span>';

    phrases.join(question.spotLink)+'.</div>';

function quiz(title,questions,again,choiceLayout){
  var index=0,score=0,missed=[];
  var total=questions.length;
  function finish(){done(title,score,index+1,total,missed,again)}
  function advance(){
    if(index+1===total){finish();return}
    index++;
    show();
  }
  function show(){
    var question=questions[index];
    if(question.spotLink){
      $(hdr(title)+progress(total,index)+'<div class="card">'+questionKind(question)+spotPrompt(question)+'</div>');
      bindSpot(question,function(option){answer(question,option)});
      return;
    }
    $(hdr(title)+progress(total,index)+'<div class="card">'+questionKind(question)+
      '<h1 class="q" id="screen-focus" tabindex="-1">'+question.q+'</h1></div>'+
      '<div class="'+choiceLayout+'" id="o"></div>');
    question.o.forEach(function(option){
      var button=document.createElement("button");
      button.textContent=option[0];
      button.onclick=function(){answer(question,option)};
      g("o").appendChild(button);
    });
  }
  function answer(question,chosen){
    var correct=Boolean(chosen[1]);
    var solution=question.o.find(function(option){return option[1]});
    var selectedScene=question.spotLink?spotSentence(question,chosen):"";
    var explanation=selectedScene?spotExplanation(question,solution):solution[2];
    if(correct)score++;
    else missed.push({number:index+1,question:question.q,chosen:chosen,solution:solution});
    if(correct&&score===WIN_TARGET){
      victory(title,explanation,index+1===total,advance,finish,selectedScene);
      return;
    }
    var tone=correct?"good":"bad";
    var feedback=selectedScene?explanation:chosen[2]+
      (correct?note(true):'<p class="nt">الإجابة الصحيحة · '+solution[0]+'</p>');
    $(hdr(title)+progress(total,index)+
      '<div class="card '+(selectedScene?"":tone)+'">'+questionKind(question)+
      (selectedScene||'<div class="q">'+question.q+'</div>')+'</div>'+
      '<div class="fb '+tone+'"><b id="screen-focus" tabindex="-1">'+(correct?pick(OKH):pick(NOH))+'</b>'+
      feedback+'</div>'+
      nextBtn(index===total-1));
    g("n").onclick=advance;
  }
  show();
}

function binaryQuestion(item,trueLabel,falseLabel){
  return {q:item[0],o:[[trueLabel,item[1],item[2]],[falseLabel,!item[1],item[2]]]};
}
function matchQuestion(item){
  var others=shuffle(TYPES.filter(function(type){return type!==item[1]})).slice(0,3).map(function(type){
    return [type,0,"هذا المثال يطابق: "+item[1]+"."];
  });
  return {q:"ما نوع العنف في هذا المثال؟ «"+item[0]+"»",o:shuffle([[item[1],1,item[2]]].concat(others))};
}
var QUIZ_GAMES={

  spot:{title:"وين المشكلة؟",bank:SPOT},
  scen:{title:"ماذا تفعل لو؟",bank:SCEN,count:4,layout:"opts",
    prepare:function(item){return {q:item.q,o:shuffle(item.o)}}},

function drawQuestions(key,count){

}
function openGame(key){

function spotGame(){
  var title=QUIZ_GAMES.spot.title;

  function nextScene(){
    var question=drawQuestions("spot",1)[0];
    var solution=question.o.find(function(option){return option[1]});

      var feedback=chosen?'<div class="spot-feedback">'+spotExplanation(question,solution)+'</div>':"";

      g("spot-home").onclick=home;

function canvasLines(ctx,text,maxWidth){
  var lines=[],line="";
  text.split(/\s+/).forEach(function(word){
    var next=line?line+" "+word:word;
    if(line&&ctx.measureText(next).width>maxWidth){
      lines.push(line);
      line=word;
    }else line=next;
  });
  if(line)lines.push(line);
  return lines;
}
function downloadCard(title,description,signature,caption,number){
  try{
    var canvas=document.createElement("canvas");
    canvas.width=1080;
    canvas.height=800;
    var ctx=canvas.getContext("2d");
    if(!ctx)throw new Error("Canvas unavailable");
    var palette=getComputedStyle(g("pledge-card"));
    ctx.fillStyle=palette.backgroundColor;
    ctx.fillRect(0,0,1080,800);
    ctx.fillStyle=palette.color;
    ctx.strokeStyle=palette.color;
    ctx.globalAlpha=.3;
    ctx.lineWidth=3;
    ctx.strokeRect(36,36,1008,728);
    ctx.globalAlpha=1;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.direction="rtl";
    var fonts=' "Tajawal","Segoe UI",Tahoma,Arial,sans-serif';
    function text(content,weight,size,centerY,lineHeight){
      ctx.font=weight+" "+size+"px"+fonts;
      var lines=canvasLines(ctx,content,856);
      lines.forEach(function(line,i){
        ctx.fillText(line,540,centerY+(i-(lines.length-1)/2)*lineHeight,856);
      });
    }
    text(ORG.name,700,42,125,50);
    text(title,800,68,340,88);
    text(description,400,41,520,58);
    if(signature)text(signature,700,40,630,54);
    text(caption,400,27,710,35);
    var link=document.createElement("a");
    link.href=canvas.toDataURL("image/png");
    link.download="بطاقة-التزامي-"+number+".png";
    document.body.appendChild(link);
    link.click();
    link.remove();
    g("download-status").textContent="";
  }catch(error){
    g("download-status").textContent="تعذّر تجهيز الصورة على هذا المتصفح. جرّب متصفحاً آخر أو التقط صورة للبطاقة.";
  }
}
